<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181716" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Names">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Baby Name Ranker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Name Ranker</h1>
    <div class="gender-toggle" role="tablist" aria-label="Name list">
      <button type="button" data-gender="girl" role="tab">Girl</button>
      <button type="button" data-gender="boy" role="tab">Boy</button>
    </div>
  </header>

  <main id="app"></main>

  <script src="names.js"></script>
  <script src="app.js"></script>
</body>
</html>
