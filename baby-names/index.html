<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Name Ranker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Name Ranker</h1>
    <div class="gender-toggle" role="tablist" aria-label="Name list">
      <button type="button" data-gender="girl" role="tab">Girl</button>
      <button type="button" data-gender="boy" role="tab">Boy</button>
    </div>
  </header>

  <main id="app"></main>

  <script src="names.js"></script>
  <script src="app.js"></script>
</body>
</html>
